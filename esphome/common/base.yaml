# Shared config for all hackerspace nodes.
# Node files set ${name} and ${friendly_name} via substitutions, then include this.

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # If WiFi is unreachable for 1 min, the node opens its own hotspot
  # so you can connect and reconfigure it at http://192.168.4.1
  ap:
    ssid: ${name}
    password: !secret fallback_ap_password

captive_portal:

logger:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

sensor:
  - platform: wifi_signal
    name: WiFi Signal
    update_interval: 60s

  - platform: uptime
    name: Uptime

button:
  - platform: restart
    name: Restart
